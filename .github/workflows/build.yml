name: Build M4Nexus (AnyKernel3, manual)

on:
  workflow_dispatch:
    inputs:
      device:
        description: "Device to build (all = star2lte + starlte + crownlte)"
        type: choice
        default: all
        options:
          - all
          - star2lte
          - starlte
          - crownlte
      release:
        description: "Publish a GitHub release"
        type: boolean
        default: true
      prerelease:
        description: "Mark the release as pre-release"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  KERNEL_NAME: M4Nexus
  ARCH: arm64
  CLANG_TRIPLE: aarch64-linux-gnu-
  CROSS_COMPILE: aarch64-linux-gnu-
  CCACHE_DIR: ${{ github.workspace }}/.ccache

defaults:
  run:
    shell: bash

jobs:
  prepare:
    name: Select devices
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.select.outputs.matrix }}
      suffix: ${{ steps.select.outputs.suffix }}
    steps:
      - name: Build device matrix
        id: select
        env:
          INPUT_DEVICE: ${{ inputs.device }}
        run: |
          set -e
          ALL="$(cat <<'EOF'
          [
            {"device":"star2lte","defconfig":"exynos9810-star2lte_defconfig","marketing":"Galaxy S9+","models":"SM-G965F SM-G965N SM-G965U"},
            {"device":"starlte","defconfig":"exynos9810-starlte_defconfig","marketing":"Galaxy S9","models":"SM-G960F SM-G960N SM-G960U"},
            {"device":"crownlte","defconfig":"exynos9810-crownlte_defconfig","marketing":"Galaxy Note9","models":"SM-N960F SM-N960N SM-N960U"}
          ]
          EOF
          )"

          if [ "${INPUT_DEVICE:-all}" = "all" ]; then
            SEL="$(jq -c '.' <<<"$ALL")"
            SUFFIX="all"
          else
            SEL="$(jq -c --arg d "$INPUT_DEVICE" 'map(select(.device == $d))' <<<"$ALL")"
            SUFFIX="$INPUT_DEVICE"
          fi

          [ "$(jq 'length' <<<"$SEL")" -ge 1 ] || { echo "No device matched '$INPUT_DEVICE'"; exit 1; }
          echo "matrix=${SEL}"    >> "$GITHUB_OUTPUT"
          echo "suffix=${SUFFIX}" >> "$GITHUB_OUTPUT"
          echo "Building: $(jq -r 'map(.device) | join(", ")' <<<"$SEL")"

  build:
    name: Build ${{ matrix.device }}
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    env:
      DEVICE: ${{ matrix.device }}
      DEFCONFIG: ${{ matrix.defconfig }}
      MARKETING: ${{ matrix.marketing }}
      MODELS: ${{ matrix.models }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang lld llvm gcc-aarch64-linux-gnu binutils-aarch64-linux-gnu \
            bc bison flex libssl-dev libelf-dev libncurses-dev \
            device-tree-compiler dwarves cpio xz-utils zip unzip python3 ccache git

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ matrix.device }}-${{ github.sha }}
          restore-keys: ccache-${{ matrix.device }}-

      - name: Host tool fixes for a 4.9 tree on a modern host
        run: |
          # gcc >= 10 defaults to -fno-common: dtc's lexer defines yylloc twice
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.l; do
            [ -f "$f" ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f" || true
          done

      - name: Configure
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          MAKE_ARGS="O=out ARCH=${ARCH} CC=clang KCFLAGS=-gdwarf-4 CLANG_TRIPLE=${CLANG_TRIPLE} CROSS_COMPILE=${CROSS_COMPILE}"
          echo "MAKE_ARGS=${MAKE_ARGS}" >> "$GITHUB_ENV"
          make ${MAKE_ARGS} ${DEFCONFIG}

      - name: Build Image (kernel only, no dtb/dtbo)
        run: |
          export PATH="/usr/lib/ccache:$PATH"
          make ${MAKE_ARGS} -j"$(nproc)" Image 2>&1 | tee "build-${DEVICE}.log"
          test -f out/arch/arm64/boot/Image
          ccache -s || true

      - name: Package AnyKernel3
        id: pack
        run: |
          set -e
          DATE="$(date -u +%Y%m%d)"
          ZIP="${KERNEL_NAME}-${DEVICE}-${DATE}.zip"

          DEVNAMES="device.name1=${DEVICE}"
          i=2
          for m in ${MODELS}; do
            DEVNAMES+=$'\n'"device.name${i}=${m}"
            i=$((i + 1))
          done
          while [ "$i" -le 5 ]; do
            DEVNAMES+=$'\n'"device.name${i}="
            i=$((i + 1))
          done

          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 ak3
          rm -rf ak3/.git ak3/.github ak3/README.md ak3/LICENSE ak3/modules ak3/patch ak3/ramdisk

          cat > ak3/anykernel.sh <<EOF
          ### AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=${KERNEL_NAME} kernel for Samsung ${MARKETING} (${DEVICE})
          do.devicecheck=1
          do.modules=0
          do.systemless=0
          do.cleanup=1
          do.cleanuponabort=0
          ${DEVNAMES}
          supported.versions=
          supported.patchlevels=
          supported.vendorpatchlevels=
          '; }

          # boot partition (matched by name, case-insensitive), non A/B
          BLOCK=/dev/block/platform/11120000.ufs/by-name/BOOT;
          IS_SLOT_DEVICE=0;
          RAMDISK_COMPRESSION=auto;
          PATCH_VBMETA_FLAG=auto;

          . tools/ak3-core.sh;

          dump_boot;
          write_boot;
          EOF

          cp out/arch/arm64/boot/Image ak3/Image
          (cd ak3 && zip -r9 "../${ZIP}" . -x '*.git*')

          echo "zip=${ZIP}"     >> "$GITHUB_OUTPUT"
          echo "date=${DATE}"   >> "$GITHUB_OUTPUT"
          sha256sum "${ZIP}" | tee "${ZIP}.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.zip }}
          path: |
            ${{ steps.pack.outputs.zip }}
            ${{ steps.pack.outputs.zip }}.sha256
            build-${{ matrix.device }}.log

  release:
    name: Publish release
    needs: [prepare, build]
    if: inputs.release
    runs-on: ubuntu-22.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Release notes
        id: notes
        env:
          SUFFIX: ${{ needs.prepare.outputs.suffix }}
        run: |
          set -e
          DATE="$(date -u +%Y%m%d)"
          echo "date=${DATE}" >> "$GITHUB_OUTPUT"
          ls -l dist

          {
            echo "## ${KERNEL_NAME} (${SUFFIX})"
            echo
            echo "Flash the zip for your device in a custom recovery (AnyKernel3). Do not cross-flash."
            echo
            echo "| Device | Models | Zip |"
            echo "|---|---|---|"
            for z in dist/*.zip; do
              z="$(basename "$z")"
              case "$z" in
                *-star2lte-*)  row="Galaxy S9+ (star2lte) | SM-G965F/N/U" ;;
                *-starlte-*)   row="Galaxy S9 (starlte) | SM-G960F/N/U" ;;
                *-crownlte-*)  row="Galaxy Note9 (crownlte) | SM-N960F/N/U" ;;
                *)             row="? | ?" ;;
              esac
              echo "| ${row} | \`${z}\` |"
            done
            echo
            echo "- Source: \`${GITHUB_SHA}\`"
            echo "- Features: Simple LMK, BORE scheduler, ADIOS I/O scheduler (default), NTSYNC, multi-gen LRU (on by default), LZ4, BBRv3 (default TCP congestion control)"
            echo "- Power/thermal: iowait frequency boost off by default, runtime debug checks off"
            echo
            echo "SHA256:"
            echo '```'
            cat dist/*.sha256
            echo '```'
          } > RELEASE_NOTES.md

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.suffix }}-${{ steps.notes.outputs.date }}-${{ github.run_number }}
          name: ${{ env.KERNEL_NAME }} ${{ needs.prepare.outputs.suffix }} ${{ steps.notes.outputs.date }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ inputs.prerelease || false }}
          target_commitish: ${{ github.sha }}
          files: |
            dist/*.zip
            dist/*.sha256
